name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Worker types are up to date
        run: npx wrangler types --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Deploys main to Cloudflare after the checks pass. Needs the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID repo secrets (scripts/setup-cloudflare.sh sets them).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migrations run before the new code goes live, so it never sees an old schema.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply eoe-symptom-tracker --remote
      - name: Build and deploy
        run: npm run deploy
